<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="8"/>

  <!-- TV Antenna -->
  <path d="M190 120 L256 190 L322 120" fill="none" stroke="url(#screenGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- TV Body Monitor -->
  <rect x="64" y="180" width="384" height="256" rx="36" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="8"/>
  
  <!-- Screen Glow Border -->
  <rect x="88" y="204" width="336" height="208" rx="24" fill="#030712" stroke="url(#screenGrad)" stroke-width="6" filter="url(#glow)"/>

  <!-- Play Triangle in Center -->
  <polygon points="230,260 310,308 230,356" fill="url(#playGrad)"/>

  <!-- Live Pulse Dot -->
  <circle cx="390" cy="236" r="10" fill="#10b981"/>
  <circle cx="390" cy="236" r="18" fill="none" stroke="#10b981" stroke-width="4" opacity="0.6"/>

  <!-- TV Stand -->
  <path d="M210 440 L302 440 M256 436 L256 460 M180 460 L332 460" stroke="url(#screenGrad)" stroke-width="14" stroke-linecap="round"/>
</svg>
